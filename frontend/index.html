<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plot Watch</title>
<style>
  :root { --ink:#1f2a24; --muted:#5d6b63; --line:#d9dfd9; --bg:#f7f8f5; --accent:#2f6b4f; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.5; }
  main { max-width: 980px; margin: 0 auto; padding: 2rem 1rem 4rem; }
  h1 { font-size: 2rem; margin: 0 0 .25rem; }
  p.sub { margin: 0 0 1.5rem; color: var(--muted); }
  form { display:grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1rem; background:#fff; border:1px solid var(--line); border-radius:8px; padding:1rem; }
  label { display:flex; flex-direction:column; font-family: system-ui, sans-serif; font-size:.85rem; color:var(--muted); gap:.25rem; }
  input { font: inherit; font-size:1rem; padding:.55rem; border:1px solid var(--line); border-radius:6px; color:var(--ink); }
  input:focus-visible, button:focus-visible { outline: 3px solid #9cc7b0; outline-offset: 1px; }
  .actions { grid-column: 1 / -1; display:flex; gap:.75rem; flex-wrap:wrap; align-items:center; }
  button { font-family: system-ui, sans-serif; font-size:1rem; padding:.65rem 1.2rem; border-radius:6px; border:1px solid var(--accent); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; }
  button.ghost { background:#fff; color:var(--accent); }
  button:disabled { opacity:.6; cursor:wait; }
  #status { margin:1.25rem 0 0; font-family: system-ui, sans-serif; color:var(--muted); }
  #status.error { color:#9b1c12; }
  .alert { margin:1.5rem 0 1rem; padding:.9rem 1rem; border-radius:6px; font-family: system-ui, sans-serif; font-weight:600; }
  .alert.alert { background:#fde8e6; color:#9b1c12; }
  .alert.watch { background:#fff3d6; color:#7a5300; }
  .alert.clear { background:#e3f4e8; color:#1d6b3a; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap:1rem; }
  figure { margin:0; }
  img { width:100%; display:block; border-radius:4px; border:1px solid var(--line); }
  figcaption { font-family: system-ui, sans-serif; font-size:.9rem; color:var(--muted); margin-top:.35rem; }
  .meta { font-family: system-ui, sans-serif; font-size:.85rem; color:var(--muted); margin-top:1rem; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>Plot Watch</h1>
  <p class="sub">Pick a place and two dates. We compare satellite images and show what changed.</p>

  <form id="form">
    <label>Latitude
      <input id="lat" type="number" step="any" required value="26.4503">
    </label>
    <label>Longitude
      <input id="lon" type="number" step="any" required value="80.1921">
    </label>
    <label>Area size (km)
      <input id="size" type="number" step="0.5" min="0.5" max="5" required value="2">
    </label>
    <label>Before date
      <input id="before" type="date" required value="2020-02-15">
    </label>
    <label>After date
      <input id="after" type="date" required value="2025-02-15">
    </label>
    <div class="actions">
      <button class="primary" id="go" type="submit">Compare images</button>
      <button class="ghost" id="psit" type="button">Use PSIT campus</button>
    </div>
  </form>

  <p id="status" role="status"></p>

  <section id="result" class="hidden">
    <div id="alert" class="alert"></div>
    <div class="grid" id="images"></div>
    <p class="meta" id="meta"></p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const form = $("form"), statusEl = $("status"), go = $("go");

$("after").max = new Date().toISOString().slice(0, 10);

$("psit").addEventListener("click", () => {
  $("lat").value = 26.4503;
  $("lon").value = 80.1921;
});

form.addEventListener("submit", async e => {
  e.preventDefault();
  $("result").classList.add("hidden");
  statusEl.className = "";
  statusEl.textContent = "Fetching satellite images. This takes about 30 to 90 seconds.";
  go.disabled = true;
  try {
    const resp = await fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        lat: $("lat").value, lon: $("lon").value, size_km: $("size").value,
        before_date: $("before").value, after_date: $("after").value
      })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || "Something went wrong.");
    render(data);
    statusEl.textContent = "";
  } catch (err) {
    statusEl.className = "error";
    statusEl.textContent = err.message;
  } finally {
    go.disabled = false;
  }
});

function render(d) {
  const box = $("alert");
  box.className = "alert " + d.level;
  box.textContent = d.alert;
  const caps = { before: "Before", after: "After", change: "Detected change (red)" };
  $("images").innerHTML = Object.entries(d.image_urls).map(([k, url]) =>
    `<figure><img src="${url}" alt="${caps[k]}"><figcaption>${caps[k]}` +
    (k === "before" ? ` (${d.before_scene.date})` : k === "after" ? ` (${d.after_scene.date})` : "") +
    `</figcaption></figure>`).join("");
  $("meta").textContent =
    `Changed area: ${d.change_percent}% of the selected region. ` +
    `Images used: ${d.before_scene.date} and ${d.after_scene.date} (nearest clear Sentinel-2 scenes, 10 m resolution).`;
  $("result").classList.remove("hidden");
}
</script>
</body>
</html>
