services:
  - type: web
    name: plot-watch
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --timeout 180 --workers 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9